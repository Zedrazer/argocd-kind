broker:
  config:
    baseUrl: http://localhost:8989
    basicAuth:
      enabled: true
      allowPublicRead: false
      publicHeartbeat: true
      enablePublicBadgeAccess: false
      writeUser:
        username: "admin"
        password: "admin"
      readUser:
        username: "pactreader"
        password: "pactreader"

service:
  type: ClusterIP

database:
  adapter: postgres
  host: postgres.platform.svc.cluster.local
  port: 5432
  databaseName: pactbroker
  auth:
    username: pactbroker
    password: pactbroker
    existingSecretPasswordKey: "password"

ingress:
  enabled: false