service:
  type: ClusterIP

pactbroker:
  baseUrl: http://pact-broker
  logLevel: INFO

database:
  adapter: postgres
  host: postgres.platform.svc.cluster.local
  port: 5432
  databaseName: pactbroker
  auth:
    username: pactbroker
    password: pactbroker
    existingSecretPasswordKey: "password"

basicAuth:
  enabled: true
  allowPublicRead: false
  publicHeartbeat: true
  enablePublicBadgeAccess: false
  writeUser:
    username: "admin"
    password: "admin"
  readUser:
    username: "pactreader"
    password: "pactreader"

ingress:
  enabled: false