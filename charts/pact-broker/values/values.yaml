service:
  type: ClusterIP

pactbroker:
  baseUrl: http://pact-broker
  logLevel: INFO

database:
  adapter: postgres
  host: postgres.platform.svc.cluster.local
  port: 5432
  databaseName: pactbroker
  auth:
    username: pactbroker
    password: pactbroker
    existingSecret: ""                   # leave empty if using inline credentials
    existingSecretPasswordKey: "password"

auth:
  enabled: true
  username: admin
  password: admin

ingress:
  enabled: false